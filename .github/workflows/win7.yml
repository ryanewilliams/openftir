name: Build Windows 7 app

# A Python 3.8 / Qt 5 build for Windows 7 PCs. Run it manually from the
# Actions tab; "Build apps" also runs it for every tagged release.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    runs-on: windows-2022
    env:
      BITS: ${{ matrix.arch == 'x64' && '64' || '32' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: ${{ matrix.arch }}

      - name: Install test dependencies
        run: |
          python -m pip install -r packaging/win7/requirements.txt "pytest<8" "pytest-qt<4.5"

      - name: Run tests on Python 3.8 / Qt 5
        env:
          PYTHONPATH: packaging/win7/testsite;packaging/win7;packaging/win7/shim;src
          PYTEST_QT_API: pyside2
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --tb=short

      - name: Build
        run: python packaging/win7/build.py

      - name: Self-test the frozen app
        run: dist/OpenFTIR/openftir-selftest.exe

      - uses: actions/upload-artifact@v4
        with:
          name: OpenFTIR-Windows7-${{ env.BITS }}bit
          path: dist/OpenFTIR-win7-${{ env.BITS }}bit.zip
