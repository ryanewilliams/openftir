name: Build apps

# Runs on version tags (publishes a GitHub Release) or manually from the
# Actions tab (downloadable build artifacts only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: dist/OpenFTIR-windows.zip
          - os: macos-latest          # Apple Silicon
            asset: dist/OpenFTIR-macos.zip
          - os: ubuntu-22.04          # older glibc = runs on more distros
            asset: dist/OpenFTIR-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python packaging/build.py --no-venv

      - name: Smoke-test the frozen CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            dist/OpenFTIR.app/Contents/MacOS/openftir-cli drivers
          else
            dist/OpenFTIR/openftir-cli drivers
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OpenFTIR-${{ runner.os }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
