name: Build apps

# Runs on version tags (publishes a GitHub Release) or manually from the
# Actions tab (downloadable build artifacts only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: dist/OpenFTIR-windows.zip
          - os: macos-latest          # Apple Silicon
            asset: dist/OpenFTIR-macos.zip
          - os: ubuntu-22.04          # older glibc = runs on more distros
            asset: dist/OpenFTIR-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python packaging/build.py --no-venv

      - name: Check the Mac app can take keyboard focus
        if: runner.os == 'macOS'
        run: |
          value=$(/usr/libexec/PlistBuddy -c "Print :LSBackgroundOnly" dist/OpenFTIR.app/Contents/Info.plist 2>/dev/null || echo false)
          echo "LSBackgroundOnly=$value"
          test "$value" = "false"

      - name: Smoke-test the frozen CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cli=dist/OpenFTIR.app/Contents/MacOS/openftir-cli
          else
            cli=dist/OpenFTIR/openftir-cli
          fi
          $cli drivers
          # HTTPS from inside the packaged app: the update check needs a
          # certificate store (missing on macOS until 0.2.2).
          $cli check-update

      - uses: actions/upload-artifact@v4
        with:
          name: OpenFTIR-${{ runner.os }}
          path: ${{ matrix.asset }}

  # Tagged builds only: publish all the downloads as one GitHub Release.
  # The app's updater (openftir/updater.py) installs from the latest one.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Check the tag matches the app's version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/openftir/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; found = ($2 == v) ; next }
            found { print }
          ' CHANGELOG.md > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: assets/*
