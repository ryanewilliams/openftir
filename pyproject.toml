[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openftir"
version = "0.1.0"
description = "Open-source, cross-platform FTIR spectrometer control and spectral analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
gui = [
    # PySide6 6.12.0's Signal.emit() drops a reference to True on every call;
    # harmless on Python >= 3.12 (True is immortal) but it aborts the
    # interpreter on 3.10/3.11. See tests/test_gui_pyside_emit_refcount.py.
    "PySide6>=6.5; python_version >= '3.12'",
    "PySide6>=6.5,!=6.12.0; python_version < '3.12'",
    "pyqtgraph>=0.13",
    "matplotlib>=3.7",
    "openftir[probe]",
]
probe = ["pyusb>=1.2", "libusb-package"]
dev = ["pytest>=7", "pytest-qt>=4", "openftir[gui]"]

[project.scripts]
openftir = "openftir.cli:main"

[project.gui-scripts]
openftir-gui = "openftir.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openftir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
